name: Trusted Writer Branch Intake (no WordPress credentials)
on:
  workflow_run:
    workflows: ['External Writer Branch QA (read-only)']
    types: [completed]
permissions:
  contents: write
  # Wake the main QA sweep after an import (see the last step): a push made with GITHUB_TOKEN never starts another workflow.
  actions: write
concurrency:
  group: wp-writer-state
  cancel-in-progress: false
jobs:
  import:
    if: >-
      github.repository == 'thuexemayhanoi/wp-writer' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'writer/')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Re-run trusted tests and canonical QA without WordPress credentials
        run: |
          python -m unittest discover -s tests -q
          python scripts/validate.py
      - name: Import ONLY the exact green writer SHA, recalc QA and CAS commit
        env:
          WRITER_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GREEN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name 'wp-writer-branch-intake'
          git config user.email 'wp-writer-branch-intake@users.noreply.github.com'
          python scripts/writer_branch_intake.py --branch "$WRITER_BRANCH" --sha "$GREEN_SHA" --apply
      # GitHub does not start workflows from a push made with GITHUB_TOKEN, so the imported draft would sit on main until a
      # scheduled sweep (the cron is delivered late or never: no scheduled QA ran for 3.5 h on 2026-10-21). workflow_dispatch is
      # the one event the same token may start; the QA sweep is coalesced and incremental, so an extra one is cheap, and a green
      # QA run on main wakes the Publisher exactly like a push-triggered one. This step holds no WordPress secret.
      - name: Wake the main QA sweep so the imported draft reaches the Publisher
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run writer-qa.yml --ref main
      - name: Explain publication boundary
        if: always()
        run: |
          echo 'Writer branch intake carries no WordPress secret.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Normal main Writer QA is responsible for publisher trigger; Production policy is unchanged.' >> "$GITHUB_STEP_SUMMARY"

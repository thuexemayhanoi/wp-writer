name: Protected main migration readiness (read-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protected-main-readiness.yml'
      - 'scripts/protected_main_readiness.py'
      - 'scripts/production_security.py'
      - 'scripts/git_state.py'
      - '.github/workflows/factory-audit.yml'
permissions:
  contents: read
concurrency:
  group: wp-writer-protected-main-audit
  cancel-in-progress: false
jobs:
  state-transport-preflight:
    if: github.repository == 'thuexemayhanoi/wp-writer'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout trusted main read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run focused tests, no WordPress access
        run: python -m unittest discover -s tests -p 'test_protected_main_readiness.py' -v
      - name: Expose main state migration blockers without changing Production
        run: python scripts/protected_main_readiness.py --output "$RUNNER_TEMP/protected-main-readiness.json"
      - name: Upload immutable diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-main-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/protected-main-readiness.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Ensure this audit does not mutate tracked repo
        if: always()
        run: |
          test -z "$(git status --porcelain --untracked-files=no)" || {
            echo 'Read-only main protection audit changed tracked files'; exit 1;
          }

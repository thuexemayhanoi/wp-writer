name: Reconcile 1482 Excel title statuses from Publisher G7
on:
  workflow_run:
    workflows: ['Universal WordPress Publisher']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: 1482-title-plan-status-sync
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'thuexemayhanoi/wp-writer' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile title rows only from verified, exact-category G7 receipts
        run: |
          python scripts/title_plan_1482.py --sync --no-xlsx
          python scripts/title_plan_xlsx_export.py
      - name: Persist status and Excel snapshots without changing Publisher
        shell: bash
        run: |
          git config user.name "wp-writer-bot"
          git config user.email "wp-writer-bot@users.noreply.github.com"
          git add editorial/title-plan-1482/plan.json \
            editorial/title-plan-1482/status.json \
            editorial/title-plan-1482/seo-tieu-de-*-494.csv \
            editorial/title-plan-1482/seo-tieu-de-*-494.xlsx
          if git diff --cached --quiet; then
            echo "No new verified G7 receipts; no spreadsheet changes"
            exit 0
          fi
          git commit -m "chore: update 1482 title statuses from true G7 [skip ci]"
          git push origin HEAD:main

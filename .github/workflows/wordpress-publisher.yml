name: Universal WordPress Publisher
on:
  workflow_dispatch:
  # The primary execution path is the successful, completed *main push*
  # Writer QA workflow. This replaces parallel push-based publishing.
  workflow_run:
    workflows: ['Universal writer QA (no WordPress credentials)']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/wordpress-publisher.yml', 'config/production-policy.json']
  # Fallback retry for a missed workflow_run / later inventory refresh.
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: wp-writer-state
  cancel-in-progress: false
jobs:
  publisher:
    # Never run on a PR's workflow_run or a failed QA event.
    # The publisher checks the live source and taxonomy again before any POST.
    if: >-
      github.repository == 'thuexemayhanoi/wp-writer' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Confirm the successful QA run is from trusted main history
        if: github.event_name == 'workflow_run'
        env:
          QA_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$QA_HEAD_SHA" origin/main
          echo "QA_COMPLETED_BEFORE_PUBLISHER: $QA_HEAD_SHA"
      - run: |
          git config user.name 'wp-writer-bot'
          git config user.email 'wp-writer-bot@users.noreply.github.com'
          python -m unittest discover -s tests -q
      - name: Admit GitHub-only writer drafts by lease and immutable hash
        run: python scripts/intake.py
      - name: Inspect mode before exposing WordPress credentials
        id: mode
        run: |
          python - <<'PY'
          import json,os
          p=json.load(open('config/production-policy.json'))
          active=(
            p.get('mode')=='production'
            and p.get('production_enabled') is True
            and bool(p.get('owner_approval_ref'))
            and p.get('acceptance_passed') is True
            and p.get('security_controls_verified') is True
            and p.get('seo_adapter_verified') is True
          ) or (
            p.get('mode')=='draft_only'
            and p.get('production_enabled') is False
            and p.get('draft_staging_enabled') is True
            and bool(p.get('draft_staging_approval_ref'))
            and p.get('security_controls_verified') is True
          )
          active=active and not p.get('paused') and not p.get('emergency_stop')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('active='+str(active).lower()+'\n')
          PY
      - if: steps.mode.outputs.active != 'true'
        run: python scripts/publisher.py
      - name: QA-gated serialized REST publisher (2x5, production gated in code)
        if: steps.mode.outputs.active == 'true'
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: python scripts/publisher.py --persist-state
      - if: always()
        run: python scripts/reports.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-receipt-${{ github.run_id }}
          path: |
            reports/
            data/qa/
      - name: Persist QA, dashboard and repair queue without retriggering publisher
        if: always()
        run: python scripts/save_reports.py

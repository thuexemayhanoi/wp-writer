name: Rebuild Excel SOP tabs on docs branch
on:
  push:
    branches:
      - docs/title-plan-1482-ai-a-to-z-*
    paths:
      - scripts/title_plan_xlsx_export.py
      - docs/TITLE-PLAN-1482-SOP.md
      - .github/workflows/title-plan-guide-rebuild.yml
permissions:
  contents: write
jobs:
  rebuild-guides-only:
    if: github.repository == 'thuexemayhanoi/wp-writer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild existing three workbooks from existing CSV only
        run: python scripts/title_plan_xlsx_export.py
      - name: Validate 494 titles per workbook, guide sheet and immutable planning data
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_title_plan_1482.py' -v
          python - <<'PY'
          import json,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('editorial/title-plan-1482')
          assert len(json.loads((p/'plan.json').read_text())['rows'])==1482
          ns={'x':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          for i in (1,2,3):
              path=p/f'seo-tieu-de-{i:02d}-494.xlsx'
              with zipfile.ZipFile(path) as zf:
                  root=ET.fromstring(zf.read('xl/worksheets/sheet3.xml'))
              cells=' '.join(x.text or '' for x in root.findall('.//x:t',ns))
              assert 'docs/TITLE-PLAN-1482-SOP.md' in cells
              assert '1–4 URL HTTPS' in cells
              assert 'CẤM excel/xlsx/csv' in cells
              assert 'G7 VERIFIED' in cells
              print(path.name,'SOP in Huong dan PASS')
          PY
          git diff --exit-code -- editorial/title-plan-1482/plan.json editorial/title-plan-1482/status.json
          git diff --exit-code -- 'editorial/title-plan-1482/*.csv'
      - name: Commit only workbook guide updates on this branch
        shell: bash
        run: |
          git config user.name 'wp-writer-bot'
          git config user.email 'wp-writer-bot@users.noreply.github.com'
          git add editorial/title-plan-1482/seo-tieu-de-*-494.xlsx
          if git diff --cached --quiet; then
             echo 'Workbooks already current'
             exit 0
          fi
          git commit -m 'data: synchronize A-Z guide tab across three Excel files [skip ci]'
          git push origin HEAD:"$GITHUB_REF_NAME"

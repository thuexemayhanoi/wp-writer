name: Factory draft-only REST acceptance
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wp-writer-state
  cancel-in-progress: false
jobs:
  draft-only:
    environment: wordpress-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          git config user.name 'wp-writer-bot'
          git config user.email 'wp-writer-bot@users.noreply.github.com'
          python -m unittest discover -s tests -v
      - name: Create ONE isolated TEST DRAFT, verify, rerun same ID, never public
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: |
          python scripts/check_health.py
          python scripts/publisher.py --persist-state --acceptance-draft
          if [ -f posts/drafts/NT-000079.md ]; then
            python scripts/intake.py
            python scripts/publisher.py --persist-state --acceptance-topic NT-000079
            python scripts/publisher.py --persist-state --acceptance-topic NT-000079
          fi
      - if: always()
        run: |
          python scripts/reports.py
          python scripts/save_reports.py

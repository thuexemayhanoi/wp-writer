name: Factory authenticated inventory (read-only WordPress)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/factory-audit.yml']
permissions:
  contents: write
concurrency:
  group: wp-writer-state
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Read authenticated inventory; preserve protected draft 3861
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
        run: python scripts/audit.py --authenticated
      - name: Save read-only audit checkpoint
        run: |
          git config user.name 'wp-writer-bot'
          git config user.email 'wp-writer-bot@users.noreply.github.com'
          git add data/existing-content-inventory.json data/existing-taxonomy.json data/protected-urls.json reports/audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh authenticated factory inventory [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

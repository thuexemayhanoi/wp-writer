# STEP 2 of the owner's simple flow (order 2026-10-17):
#   W1–W9 write  ->  [QA >=85 + duplicate check + category]  ->  Publisher  ->  public WordPress.
# The main QA sweep is coalesced on a five-minute cadence so rapid Writer pushes cannot flood Actions.
# A successful main schedule/dispatch QA run triggers "Universal WordPress Publisher" (step 3).
# This workflow holds no WordPress credentials.
name: Universal writer QA (no WordPress credentials)
on:
  workflow_dispatch:
  # Writer pushes start ONE coalesced sweep: the concurrency group below keeps at most one running and one pending
  # QA run for main (GitHub replaces an older pending run with the newest), and every sweep checks out the CURRENT
  # main tree, so ten rapid draft pushes end as one or two sweeps, never ten. The incremental sweep
  # (config/qa-rules.json incremental_sweep) evaluates only new or changed drafts.
  # The five-minute schedule is a fallback only: GitHub delivers cron events late or not at all under load.
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    # Receipts are committed together with the draft (`writer-session.py push`), so posts/drafts/** alone wakes the
    # sweep; lease begin/release commits that only touch the registry do not.
    paths: ['posts/drafts/**', 'scripts/**', 'tests/**', 'config/**', 'data/taxonomy.json', '.github/workflows/**']
  pull_request:
    paths: ['posts/drafts/**', 'scripts/**', 'tests/**', 'config/**', 'data/topics.jsonl', 'data/taxonomy.json', '.github/workflows/**']
permissions:
  contents: read
# Read-only QA runs cannot race one another. A later scheduled sweep reads every newly committed draft.
concurrency:
  group: wp-writer-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests-and-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # A coalesced sweep must judge the latest main tree, not only the commit that woke it; PRs keep their merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      # Keep the five-minute schedule cheap during owner emergency maintenance;
      # pull_request and code/config push checks still run normally.
      - name: Skip scheduled QA while owner emergency stop is active
        id: schedule_gate
        run: |
          python - <<'PY'
          import json, os
          with open('config/production-policy.json',encoding='utf-8') as fh:
              policy=json.load(fh)
          maintenance=(policy.get('emergency_stop') is True or policy.get('paused') is True)
          run_qa=os.environ.get('GITHUB_EVENT_NAME')!='schedule' or not maintenance
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('run_qa='+str(run_qa).lower()+'\n')
          print('Run scheduled QA:', run_qa)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.schedule_gate.outputs.run_qa == 'true'
        with:
          python-version: '3.12'
      - if: steps.schedule_gate.outputs.run_qa == 'true'
        run: pip install -r requirements.txt
      - if: steps.schedule_gate.outputs.run_qa == 'true'
        run: python -m unittest discover -s tests -v
      - name: Regression tests with push-context runtime
        if: steps.schedule_gate.outputs.run_qa == 'true'
        env:
          GITHUB_EVENT_NAME: push
        run: python -m unittest discover -s tests -q
      - if: steps.schedule_gate.outputs.run_qa == 'true'
        run: python scripts/validate.py
      # Incremental sweep (config/qa-rules.json incremental_sweep): VERIFIED articles keep their frozen record, unchanged
      # drafts keep their cached record, only new or changed drafts are evaluated. Every record is still hash-checked.
      - name: Independently pass qualified articles; persist complete REPAIR tickets for failures
        if: steps.schedule_gate.outputs.run_qa == 'true'
        run: python scripts/qa_gate.py
      - if: steps.schedule_gate.outputs.run_qa == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-qa-${{ github.run_id }}
          path: |
            data/qa/
            reports/repair-queue.json

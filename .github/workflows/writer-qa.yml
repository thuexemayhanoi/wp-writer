# STEP 2 of the owner's simple flow (order 2026-10-17):
#   W1–W9 write  ->  [QA >=85 + duplicate check + category]  ->  Publisher  ->  public WordPress.
# The main QA sweep is coalesced on a five-minute cadence so rapid Writer pushes cannot flood Actions.
# A successful main schedule/dispatch QA run triggers "Universal WordPress Publisher" (step 3).
# This workflow holds no WordPress credentials.
name: Universal writer QA (no WordPress credentials)
on:
  workflow_dispatch:
  # Coalesce frequent writer commits; each sweep checks the CURRENT main tree.
  schedule:
    - cron: '*/5 * * * *'
  # Code/config changes still get immediate CI. Article push alone waits for the sweep.
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'config/**', 'data/taxonomy.json', '.github/workflows/**']
  pull_request:
    paths: ['posts/drafts/**', 'scripts/**', 'tests/**', 'config/**', 'data/topics.jsonl', 'data/taxonomy.json', '.github/workflows/**']
permissions:
  contents: read
# Read-only QA runs cannot race one another. A later scheduled sweep reads every newly committed draft.
concurrency:
  group: wp-writer-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests-and-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Regression tests with push-context runtime
        env:
          GITHUB_EVENT_NAME: push
        run: python -m unittest discover -s tests -q
      - run: python scripts/validate.py
      - name: Independently pass qualified articles; persist complete REPAIR tickets for failures
        run: python scripts/qa_gate.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-qa-${{ github.run_id }}
          path: |
            data/qa/
            reports/repair-queue.json

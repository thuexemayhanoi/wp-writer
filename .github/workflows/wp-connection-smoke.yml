name: WordPress connection smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wp-writer-connection-test
  cancel-in-progress: false
jobs:
  verify-credentials:
    if: github.repository == 'thuexemayhanoi/wp-writer'
    environment: wordpress-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
    steps:
      - name: Authenticate using environment credentials, READ-ONLY WordPress GET
        shell: python
        run: |
          import os, sys, json, base64, urllib.request, urllib.error
          def die(message):
              print("FAILED: " + message)
              sys.exit(1)
          url = os.getenv("WP_URL", "").rstrip("/")
          user = os.getenv("WP_USERNAME", "").strip()
          password = os.getenv("WP_APPLICATION_PASSWORD", "").replace(" ", "")
          if url != "https://thuexemaynguyentu.com":
              die("WP_URL does not match the approved WordPress site")
          if not user or not password:
              die("Missing WordPress Environment credential")
          basic = base64.b64encode((user + ":" + password).encode()).decode()
          request = urllib.request.Request(
              url + "/wp-json/wp/v2/users/me?context=edit",
              headers={"Authorization": "Basic " + basic, "Accept": "application/json"}
          )
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  profile = json.load(response)
          except urllib.error.HTTPError as exc:
              die("WordPress REST HTTP " + str(exc.code))
          except Exception as exc:
              die("WordPress REST " + type(exc).__name__)
          if not isinstance(profile.get("id"), int):
              die("Authenticated WordPress REST profile is missing ID")
          print("AUTH_OK: authenticated WordPress ID=" + str(profile["id"]))
          print("READ_ONLY: no WordPress posts, drafts or settings changed")

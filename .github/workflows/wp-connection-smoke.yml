name: WordPress connection smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp-connection-smoke.yml'
permissions:
  contents: read
concurrency:
  group: wp-writer-connection-test
  cancel-in-progress: false
jobs:
  verify-credentials:
    if: github.repository == 'thuexemayhanoi/wp-writer'
    environment: wordpress-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
    steps:
      - name: Verify restricted Environment credentials with READ-ONLY WordPress REST
        shell: python
        run: |
          import os, sys, json, base64, urllib.request, urllib.error
          def fail(reason):
              print("CONNECTION_FAILED: " + reason)
              sys.exit(1)
          url = os.environ.get("WP_URL", "").strip().rstrip("/")
          user = os.environ.get("WP_USERNAME", "").strip()
          password = os.environ.get("WP_APPLICATION_PASSWORD", "").replace(" ", "")
          if url != "https://thuexemaynguyentu.com":
              fail("Environment WP_URL is not the approved site")
          if not user or not password:
              fail("Required Environment WordPress credential is missing")
          auth = base64.b64encode((user + ":" + password).encode()).decode()
          req = urllib.request.Request(
              url + "/wp-json/wp/v2/users/me?context=edit",
              headers={
                  "Authorization": "Basic " + auth,
                  "Accept": "application/json",
                  "User-Agent": "wp-writer-safe-secret-smoke/1.0"
              }
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  profile = json.load(response)
          except urllib.error.HTTPError as exc:
              fail("WordPress REST authentication HTTP " + str(exc.code))
          except Exception as exc:
              fail("WordPress REST request failed: " + type(exc).__name__)
          if not isinstance(profile.get("id"), int) or not profile.get("roles"):
              fail("WordPress authenticated profile readback incomplete")
          print("ENVIRONMENT_CREDENTIALS_OK: authenticated WordPress REST account ID="
                + str(profile["id"]) + ", site=" + url)
          print("READ_ONLY_CHECK: no posts, drafts, settings, secrets or files modified")

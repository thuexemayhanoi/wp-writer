name: WordPress Environment Secrets READ-ONLY verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/wp-environment-credential-check.yml']
permissions:
  contents: read
concurrency:
  group: wp-writer-environment-secrets-readonly-check
  cancel-in-progress: false
jobs:
  verify-secrets:
    if: github.repository == 'thuexemayhanoi/wp-writer'
    environment: wordpress-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
    steps:
      - name: Validate three restricted Secrets through a READ-ONLY WordPress REST GET
        shell: python
        run: |
          import os, sys, json, base64, urllib.request, urllib.error
          def fail(reason):
              print("CONNECTION_FAILED: " + reason)
              sys.exit(1)
          url = os.getenv("WP_URL", "").strip().rstrip("/")
          user = os.getenv("WP_USERNAME", "").strip()
          password = os.getenv("WP_APPLICATION_PASSWORD", "").replace(" ", "")
          if url != "https://thuexemaynguyentu.com":
              fail("WP_URL does not match approved WordPress site")
          if not user or not password:
              fail("WP_USERNAME or WP_APPLICATION_PASSWORD is empty")
          token = base64.b64encode((user + ":" + password).encode()).decode()
          request = urllib.request.Request(
              url + "/wp-json/wp/v2/users/me?context=edit",
              headers={"Authorization": "Basic " + token, "Accept": "application/json"}
          )
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  profile = json.load(response)
          except urllib.error.HTTPError as exc:
              fail("WordPress REST authentication returned HTTP " + str(exc.code))
          except Exception as exc:
              fail("WordPress request failed: " + type(exc).__name__)
          if not isinstance(profile.get("id"), int):
              fail("Invalid authenticated WordPress user response")
          print("ENVIRONMENT_CREDENTIALS_OK: authenticated WordPress REST account ID=" + str(profile["id"]))
          print("SAFE_READ_ONLY: no WordPress posts, drafts, settings or secrets were changed")

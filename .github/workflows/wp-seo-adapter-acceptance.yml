name: GitHub WordPress Yoast SEO adapter acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wp-seo-adapter-acceptance.yml'
      - 'scripts/seo_adapter_acceptance.py'
permissions:
  contents: read
concurrency:
  group: wp-writer-seo-adapter-readback
  cancel-in-progress: false
jobs:
  smoke-draft-meta:
    if: github.repository == 'thuexemayhanoi/wp-writer'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout main without persisting token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check WordPress REST Yoast title/description and default canonical using SAME GitHub credentials
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APPLICATION_PASSWORD: ${{ secrets.WP_APPLICATION_PASSWORD }}
          SEO_ADAPTER_REPORT: ${{ runner.temp }}/seo-adapter-acceptance.json
        run: python scripts/seo_adapter_acceptance.py
      - name: Retain safe readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp-writer-seo-adapter-${{ github.run_id }}
          path: ${{ runner.temp }}/seo-adapter-acceptance.json
          if-no-files-found: ignore
          retention-days: 14

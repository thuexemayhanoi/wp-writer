name: Universal AI writer claim requests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/writer-requests/**']
permissions:
  contents: write
concurrency:
  group: wp-writer-state
  cancel-in-progress: false
jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          git config user.name 'wp-writer-bot'
          git config user.email 'wp-writer-bot@users.noreply.github.com'
          python scripts/control_requests.py

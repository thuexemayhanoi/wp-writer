name: WordPress post-publish public QA (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * *'
permissions:
  contents: read
concurrency:
  group: wp-writer-public-qa-read-only
  cancel-in-progress: false
jobs:
  check-public:
    if: github.repository == 'thuexemayhanoi/wp-writer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit-test public HTML readback
        run: python -m unittest discover -s tests -p 'test_post_publish_qa.py' -v
      - name: Check rotating batch of verified public WordPress posts
        env:
          WP_WRITER_POST_QA_OUTPUT: ${{ runner.temp }}/wp-writer-post-publish-qa.json
        run: python scripts/post_publish_qa.py --limit 40
      - name: Preserve receipt even on error
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp-writer-public-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/wp-writer-post-publish-qa.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Ensure no tracked git files were edited
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=no)"

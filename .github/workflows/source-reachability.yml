name: Source reachability from GitHub runner (read-only)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'One "url|needle" per line (needle = text the page must contain; optional)'
        required: true
      user_agents:
        description: 'Optional user agents separated by || (default: the QA agent only)'
        required: false
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'thuexemayhanoi/wp-writer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Read each source exactly like the Publisher's live QA (no WordPress, no secrets, no writes)
        env:
          PROBE_URLS: ${{ inputs.urls }}
          PROBE_UAS: ${{ inputs.user_agents }}
        run: python scripts/source_probe.py
